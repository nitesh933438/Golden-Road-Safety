name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyAP6ksECoGgJsXqmi-hsTpQFuvwct-57-M' }}
          VITE_FIREBASE_AUTH_DOMAIN: "goldenguard-7a8ee.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "goldenguard-7a8ee"
          VITE_FIREBASE_STORAGE_BUCKET: "goldenguard-7a8ee.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "364129436292"
          VITE_FIREBASE_APP_ID: "1:364129436292:web:ed797e2cdbddd83db878d1"
          VITE_FIREBASE_MEASUREMENT_ID: "G-H07B0LRX3Q"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
